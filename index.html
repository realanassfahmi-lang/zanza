<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zanza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F9; --card:#FFFFFF; --line:#EAEAEE; --text:#1A1A2E; --dim:#8A8A9A;
  --orange:#FF6B35; --orange-dark:#E85A28; --teal:#1FA37D; --red:#E5484D; --navy:#1C2333; --wa:#25D366;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}
#app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
button{font-family:inherit; cursor:pointer;}
.hide{display:none !important;}

.hamburger{width:18px; height:13px; position:relative;}
.hamburger span{position:absolute; right:0; left:0; height:2px; background:var(--text); border-radius:2px;}
.hamburger span:nth-child(1){top:0;} .hamburger span:nth-child(2){top:5.5px;} .hamburger span:nth-child(3){top:11px;}

.topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; box-shadow:0 1px 3px rgba(20,20,40,.04);}
.logo{display:flex; align-items:center; gap:8px;}
.logo .mark{width:32px; height:32px; border-radius:9px; background:var(--orange); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;}
.logo .txt{font-weight:800; font-size:16px;}
.testing-badge{font-size:10px; background:var(--bg); color:var(--dim); padding:3px 9px; border-radius:20px; border:1px solid var(--line); font-weight:600;}
.icon-btn{width:36px; height:36px; border-radius:50%; background:var(--bg); border:none; display:flex; align-items:center; justify-content:center;}

#screen{flex:1; padding-bottom:78px;}
.section{padding:16px 18px;}
.h1{font-size:19px; font-weight:800; margin-bottom:4px;}
.sub{font-size:13px; color:var(--dim); line-height:1.7;}

.mode-switch{display:flex; background:var(--bg); border-radius:12px; padding:4px; margin-top:12px;}
.mode-switch button{flex:1; padding:10px; border:none; background:transparent; border-radius:9px; font-size:13px; font-weight:700; color:var(--dim); font-family:inherit;}
.mode-switch button.active{background:var(--card); color:var(--orange-dark); box-shadow:0 1px 4px rgba(0,0,0,.08);}

.search-bar{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; margin-top:12px;}
.search-bar input{width:100%; border:none; outline:none; background:transparent; font-size:14px; font-family:inherit;}

.chip-row{display:flex; gap:8px; overflow-x:auto; padding:12px 0 2px; scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; padding:9px 14px; border-radius:9px; background:var(--card); border:1px solid var(--line); font-size:12.5px; color:var(--dim); white-space:nowrap;}
.chip.active{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700;}

.label-row{display:flex; justify-content:space-between; align-items:center; margin:18px 0 8px;}
.label-row h3{font-size:14.5px; font-weight:800;}
.label-row a{font-size:12.5px; color:var(--orange-dark); text-decoration:none; font-weight:700;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.gcard{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 1px 4px rgba(20,20,40,.04);}
.gcard .ph{width:100%; height:104px; background:#EFEFF3 center/cover no-repeat;}
.gcard .info{padding:10px 11px;}
.gcard .t{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.gcard .p{font-size:14px; font-weight:800; color:var(--orange-dark); margin-top:4px;}
.gcard .m{font-size:11px; color:var(--dim); margin-top:2px;}

.list-row{display:flex; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:10px; box-shadow:0 1px 4px rgba(20,20,40,.04);}
.list-row .ph{width:92px; min-width:92px; height:92px; background:#EFEFF3 center/cover no-repeat;}
.list-row .body{padding:11px 13px; flex:1; min-width:0;}
.list-row .t{font-size:14px; font-weight:700;}
.list-row .p{font-size:14px; font-weight:800; color:var(--orange-dark); margin-top:4px;}
.list-row .m{font-size:11.5px; color:var(--dim); margin-top:3px;}
.tag{display:inline-block; font-size:10.5px; padding:3px 9px; background:var(--bg); border-radius:8px; color:var(--dim); margin-top:6px;}

.empty{text-align:center; padding:50px 18px; color:var(--dim); font-size:13.5px; line-height:1.8;}

.filters{display:flex; gap:8px; margin-top:10px;}
.filters select, .filters input{flex:1; background:var(--card); border:1px solid var(--line); color:var(--text); padding:10px; border-radius:10px; font-size:12.5px; font-family:inherit;}

.bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--card); border-top:1px solid var(--line); display:flex; z-index:40; box-shadow:0 -1px 6px rgba(20,20,40,.05);}
.navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 4px 8px; color:var(--dim); background:none; border:none; font-size:10.5px; font-family:inherit;}
.navbtn svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8;}
.navbtn.active{color:var(--orange-dark);}
.navbtn.active svg{fill:currentColor; fill-opacity:.12;}
.navbtn.fab-mid{position:relative;}
.navbtn.fab-mid .plus-label{margin-top:1px;}
.navbtn.fab-mid .plus{width:40px; height:40px; border-radius:50%; background:var(--orange); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; margin-top:-20px; box-shadow:0 6px 14px rgba(255,107,53,.4); font-weight:700;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--dim); margin-bottom:6px; font-weight:600;}
.field input, .field select, .field textarea{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:11px 13px; border-radius:10px; font-size:14px; font-family:inherit;}
.field textarea{resize:none; min-height:70px;}
.btn-main{width:100%; background:var(--orange); color:#fff; border:none; padding:14px; border-radius:12px; font-weight:800; font-size:14px;}
.btn-ghost{width:100%; background:transparent; color:var(--dim); border:1px solid var(--line); padding:12px; border-radius:12px; font-size:13.5px; margin-top:8px;}
.btn-google{width:100%; background:#fff; color:var(--text); border:1px solid var(--line); padding:13px; border-radius:12px; font-weight:700; font-size:13.5px; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn-wa{background:var(--wa); color:#fff;}
.contact-row a{display:flex; align-items:center; justify-content:center; gap:6px;}
.wa-icon{width:16px; height:16px; flex-shrink:0;}
.err{color:var(--red); font-size:12px; margin:-8px 0 10px;}
.divider{display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--dim); font-size:12px;}
.divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--line);}
.photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.photo-slot{aspect-ratio:1; border:1.5px dashed var(--line); border-radius:10px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:12px; background:var(--bg);}
.photo-slot img{width:100%; height:100%; object-fit:cover;}
.photo-slot input{position:absolute; inset:0; opacity:0;}

.gallery-main{width:100%; height:230px; background:#EFEFF3 center/cover no-repeat;}
.phone-box{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.phone-box .num{font-size:15px; font-weight:700; direction:ltr;}
.blur{filter:blur(5px);}
.pill-btn{background:var(--orange); color:#fff; border:none; padding:9px 14px; border-radius:10px; font-weight:700; font-size:12.5px;}
.contact-row{display:flex; gap:10px; margin-top:10px;}
.contact-row a{flex:1; text-align:center; padding:11px; border-radius:10px; font-weight:700; font-size:13px; text-decoration:none; color:#fff;}
.commission-badge{display:inline-block; background:rgba(31,163,125,.1); color:var(--teal); padding:7px 12px; border-radius:10px; font-size:12px; font-weight:700; margin-top:10px;}

.auth-wrap{padding:44px 22px 22px; text-align:center;}
.auth-wrap .mark{width:60px; height:60px; border-radius:16px; background:var(--orange); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:26px; margin:0 auto 14px;}
.auth-wrap .badge{display:inline-block; font-size:11px; background:var(--bg); color:var(--dim); padding:5px 12px; border-radius:20px; margin-bottom:12px; border:1px solid var(--line);}
.auth-wrap .tagline{color:var(--dim); font-size:13px; margin-bottom:24px;}
.auth-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; text-align:right;}
.auth-tabs{display:flex; gap:6px; background:var(--bg); border-radius:10px; padding:4px; margin-bottom:18px;}
.auth-tabs button{flex:1; padding:9px; border:none; background:transparent; border-radius:8px; font-size:13px; font-weight:700; color:var(--dim); font-family:inherit;}
.auth-tabs button.active{background:var(--card); color:var(--orange-dark);}
.role-pick{display:flex; gap:10px; margin-bottom:6px;}
.role-pick .opt{flex:1; padding:12px 8px; text-align:center; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; font-size:12.5px; color:var(--dim);}
.role-pick .opt.active{border-color:var(--orange); color:var(--orange-dark); background:rgba(255,107,53,.06); font-weight:700;}

.pro-card{background:linear-gradient(135deg,var(--navy),#2A3550); border-radius:16px; padding:18px; color:#fff; margin-bottom:16px;}
.pro-card .t{font-size:15px; font-weight:800;}
.pro-card .s{font-size:12px; color:#B9C0D6; margin-top:4px; line-height:1.6;}
.pro-card button{width:100%; background:var(--teal); color:#fff; border:none; padding:12px; border-radius:10px; font-weight:700; font-size:13px; margin-top:12px;}
.pro-status{background:rgba(31,163,125,.12); color:var(--teal); border-radius:10px; padding:12px 14px; font-size:12.5px; font-weight:700; margin-bottom:16px;}

.profile-cover{height:64px; background:linear-gradient(120deg,var(--navy),#33406A); border-radius:16px 16px 0 0; margin-top:4px;}
.profile-head{background:var(--card); border:1px solid var(--line); border-top:none; border-radius:0 0 16px 16px; padding:0 18px 18px; margin-bottom:18px; box-shadow:0 1px 4px rgba(20,20,40,.04);}
.avatar-wrap{position:relative; width:76px; margin:-38px auto 0;}
.avatar{width:76px; height:76px; border-radius:50%; background:#EFEFF3 center/cover no-repeat; border:3px solid var(--card); display:flex; align-items:center; justify-content:center; color:var(--dim); font-weight:800; font-size:24px; overflow:hidden;}
.avatar-edit{position:absolute; bottom:0; right:0; width:24px; height:24px; border-radius:50%; background:var(--orange); border:2px solid var(--card); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.avatar-edit input{position:absolute; inset:0; opacity:0;}
.avatar-edit svg{width:12px; height:12px; stroke:#fff; fill:none; stroke-width:2;}
.profile-name{text-align:center; font-size:17px; font-weight:800; margin-top:10px;}
.profile-sub{text-align:center; font-size:12.5px; color:var(--dim); margin-top:2px;}
.edit-toggle{display:block; margin:14px auto 0; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:8px 16px; font-size:12.5px; font-weight:700; color:var(--orange-dark);}

.settings-row{display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;}
.settings-row .l{font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:9px;}
.wa-round{width:30px; height:30px; border-radius:50%; background:var(--wa); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.wa-round svg{width:16px; height:16px;}
.lang-pick{display:flex; gap:6px;}
.lang-pick button{padding:7px 11px; border-radius:8px; border:1px solid var(--line); background:var(--bg); font-size:12px; font-family:inherit;}
.lang-pick button.active{background:var(--orange); color:#fff; border-color:var(--orange);}

.toast{position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 20px; border-radius:10px; font-size:13px; font-weight:700; z-index:200; display:none;}
</style>
</head>

async function renderBrowseList(){
  const all=(await getAll()).filter(l=>l.status==='active');

function renderPhotoGrid(){
  const grid=$('pGrid'); let html='';
  for(let i=0;i<Math.min(postPhotos.length+1,4);i++){
    if(postPhotos[i]) html+=`<div class="photo-slot"><img src="${postPhotos[i]}"></div>`;
    else html+=`<div class="photo-slot">+<input type="file" accept="image/*" id="addPh"></div>`;
  }
  grid.innerHTML=html;
  const inp=$('addPh'); if(inp) inp.onchange=handlePhoto;
}
function handlePhoto(e){
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas'); const mw=650; const sc=Math.min(1,mw/img.width);
      cv.width=img.width*sc; cv.height=img.height*sc;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      postPhotos.push(cv.toDataURL('image/jpeg',.6));
      renderPhotoGrid();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(f);
}
async function submitListing(){

  if(!title||!price){$('pErr').textContent=tt('errFill'); $('pErr').classList.remove('hide'); return;}

    title, category:$('pCat').value, price, city:$('pCity').value,
    description:$('pDesc').value.trim(), commission:$('pComm').value.trim(), photos:postPhotos.slice(),
    phone:session.phone, seller_id:session.id, seller_name:session.name
  });
  if(!res.ok){ $('pErr').textContent=tt('errFill'); $('pErr').classList.remove('hide'); $('pubBtn').disabled=false; return; }
  currentDetail=res.data.id; tab='detail'; render();
}

        if(res.ok) session.avatar_url=res.data.avatar_url;
        renderProfile();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(f);
  };
  const saveProfileBtn=$('saveProfileBtn');
  if(saveProfileBtn) saveProfileBtn.onclick=async()=>{
    const newName=$('eName').value.trim();
    const newCity=$('eCity').value;
    const curPass=$('eCurPass').value;
    const newPass=$('eNewPass').value;
    if(!newName){$('eErr').textContent=tt('errFill'); $('eErr').classList.remove('hide'); return;}
    if(newPass){
      if(curPass!==session.password_hash){$('eErr').textContent=tt('wrongPass'); $('eErr').classList.remove('hide'); return;}
    }
    saveProfileBtn.disabled=true;
    const res=await apiUpdateUser({id:session.id, name:newName, city:newCity, password:newPass||undefined});
    if(res.ok){ session=res.data; }
    profileEditing=false;
    renderProfile();
  };
  const logoutBtn=$('logoutBtn');
  if(logoutBtn) logoutBtn.onclick=logout;

  if(mode==='seller' && !profileEditing){
    const wrap=$('mine');
    if(!wrap) return;
    if(mine.length===0){wrap.innerHTML=`<div class="empty">${tt('empty')}</div>`;}
    else{
      wrap.innerHTML=mine.map(l=>`<div class="list-row" style="align-items:center;">
        <div class="ph" style="${l.photos&&l.photos[0]?'background-image:url('+l.photos[0]+')':''}"></div>
        <div class="body"><div class="t">${esc(l.title)}</div><div class="p">${fmt(l.price)} MAD</div></div>
        <select class="statusSel" data-id="${l.id}" style="margin:0 10px; border-radius:8px; border:1px solid var(--line);">
          <option value="active" ${l.status==='active'?'selected':''}>${tt('active')}</option>
          <option value="sold" ${l.status==='sold'?'selected':''}>${tt('sold')}</option>
          <option value="hidden" ${l.status==='hidden'?'selected':''}>${tt('hidden_s')}</option>
        </select>
      </div>`).join('');
      document.querySelectorAll('.statusSel').forEach(s=>{
        s.onchange=async()=>{await apiUpdateListingStatus(s.dataset.id, s.value);};
      });
    }
  }
}

let adminTab='users';
async function renderAdmin(){
  $('screen').innerHTML=`<div class="section">
    <div class="h1">Admin</div>
    <div class="chip-row" id="adminTabs">
      <div class="chip ${adminTab==='users'?'active':''}" data-t="users">${lang==='ar'?'المستخدمون':(lang==='fr'?'Utilisateurs':'Users')}</div>
      <div class="chip ${adminTab==='listings'?'active':''}" data-t="listings">${lang==='ar'?'الإعلانات':(lang==='fr'?'Annonces':'Listings')}</div>
    </div>
    <div id="adminBody" style="margin-top:14px;"></div>
  </div>`;
  document.querySelectorAll('#adminTabs .chip').forEach(el=>{el.onclick=()=>{adminTab=el.dataset.t; renderAdmin();};});
  const body=$('adminBody');
  if(adminTab==='users'){
    const users=await apiListUsers();
    body.innerHTML = users.length===0 ? `<div class="empty">${tt('empty')}</div>` : users.map(u=>`
      <div class="list-row" style="align-items:center; padding:12px 14px;">
        <div class="body"><div class="t">${esc(u.name)}</div><div class="m">${u.phone} — ${u.role}</div></div>
      </div>`).join('');
  } else {
    const all=await getAll();
    body.innerHTML = all.length===0 ? `<div class="empty">${tt('empty')}</div>` : all.map(l=>`
      <div class="list-row" style="align-items:center; padding:12px 14px;">
        <div class="body"><div class="t">${esc(l.title)}</div><div class="m">${l.city} — ${fmt(l.price)} MAD — ${l.status}</div></div>
        <button class="pill-btn" data-del="${l.id}" style="background:var(--red);">${lang==='ar'?'حذف':(lang==='fr'?'Suppr.':'Delete')}</button>
      </div>`).join('');
    document.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick=async()=>{
        await apiDeleteListing(b.dataset.del);
        renderAdmin();
      };
    });
  }
}

function renderSettings(){
  $('screen').innerHTML=`<div class="section">
    <div class="h1">${tt('settings')}</div>
    <div class="settings-row" style="align-items:flex-start;">
      <div>
        <div class="l" style="font-weight:700;">${esc(session.name)}</div>
        <div class="sub" style="margin-top:2px;">${session.phone} · ${session.role==='admin'?'Admin':(session.role==='seller'?tt('seller'):tt('broker'))}</div>
      </div>
    </div>
    <div class="settings-row"><div class="l">${tt('language')}</div>
      <div class="lang-pick">
        <button data-l="ar" class="${lang==='ar'?'active':''}">AR</button>
        <button data-l="fr" class="${lang==='fr'?'active':''}">FR</button>
        <button data-l="en" class="${lang==='en'?'active':''}">EN</button>
      </div>
    </div>
    <div class="settings-row" id="waRow"><div class="l"><span class="wa-round">${WA_SVG}</span>${tt('support')}</div><span>-</span></div>
    <button class="btn-ghost" id="backBtn">${lang==='ar'?'رجوع':(lang==='fr'?'Retour':'Back')}</button>
  </div>`;
  document.querySelectorAll('.lang-pick button').forEach(b=>{
    b.onclick=()=>{lang=b.dataset.l; applyDir(); tab='settings'; render();};
  });
  $('waRow').onclick=()=>{
    const msg=encodeURIComponent(lang==='ar'?'مرحباً، أحتاج مساعدة بخصوص Zanza':(lang==='fr'?'Bonjour, j\'ai besoin d\'aide avec Zanza':'Hello, I need help with Zanza'));
    window.open('https://wa.me/'+SUPPORT_WA+'?text='+msg,'_blank');
  };
  $('backBtn').onclick=()=>{tab='home'; render();};
}

boot();
</script>
